name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y flex bison

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: make

      - name: Test
        run: make test
